<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نکسرا (Nexra) | مارکت‌پلیس قالب و اسکریپت حرفه‌ای</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #060913;
            --bg-secondary: #0f1526;
            --bg-card: #131b31;
            --primary: #6366f1;
            --accent: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.09);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            line-height: 1.7;
            overflow-x: hidden;
        }

        img { max-width: 100%; display: block; }
        a { text-decoration: none; color: inherit; transition: all 0.25s ease; }

        .container {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- ۱. نوار تخفیف بالا --- */
        .top-bar {
            background: linear-gradient(90deg, #1e1b4b 0%, #4338ca 50%, #047857 100%);
            padding: 8px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .top-bar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .promo-badge {
            background: #10b981;
            color: #060913;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 6px;
            direction: ltr;
        }

        .timer-unit {
            background: rgba(0, 0, 0, 0.4);
            padding: 3px 9px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.82rem;
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* --- ۲. هدر اصلی --- */
        .header {
            background: rgba(15, 21, 38, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 0;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .logo-box img {
            height: 40px !important;
            width: auto !important;
            max-width: 140px !important;
            object-fit: contain;
            border-radius: 8px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-links a {
            font-size: 0.92rem;
            font-weight: 500;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 4px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
            border-bottom-color: var(--accent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-btn {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: 0.2s;
        }

        .cart-btn:hover { border-color: var(--accent); }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: #060913;
            font-size: 0.7rem;
            font-weight: 900;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-pro {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-pro:hover { background: var(--accent); color: #060913; }

        .btn-auth {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-auth:hover { background: #4f46e5; }

        .mobile-toggle {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* --- ۳. بخش هیرو --- */
        .hero {
            position: relative;
            background-image: url('header.png');
            background-size: cover;
            background-position: center;
            padding: 65px 0;
            border-bottom: 1px solid var(--border);
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(6, 9, 19, 0.72) 0%, rgba(6, 9, 19, 0.92) 100%);
        }

        .hero-inner {
            position: relative;
            z-index: 2;
            max-width: 760px;
            margin: 0 auto;
            background: rgba(19, 27, 49, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .hero-tag {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .hero-inner h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: #fff;
        }

        .hero-inner h1 span { color: #34d399; }
        .hero-inner p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 26px; }

        .search-bar {
            display: flex;
            background: #060913;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 6px;
            margin-bottom: 18px;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 10px 14px;
            font-size: 0.92rem;
        }

        .search-bar button {
            background: var(--accent);
            color: #060913;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .popular-tags {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .tag-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border);
            color: #e2e8f0;
            padding: 3px 11px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
        }

        .tag-btn:hover { background: var(--primary); border-color: var(--primary); }

        /* --- ۴. بخش ویژگی‌ها --- */
        .features {
            padding: 35px 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .feature-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .feature-box i {
            font-size: 1.4rem;
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-box h4 { font-size: 0.9rem; margin-bottom: 2px; }
        .feature-box span { font-size: 0.76rem; color: var(--text-muted); }

        /* --- ۵. بخش محصولات --- */
        .products { padding: 60px 0 30px; }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .section-head h2 { font-size: 1.5rem; font-weight: 900; }
        .section-head h2 span { color: #34d399; }

        .filter-group { display: flex; flex-wrap: wrap; gap: 8px; }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: #cbd5e1;
            padding: 7px 15px;
            border-radius: 10px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.5);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .card-thumb {
            position: relative;
            height: 175px;
            overflow: hidden;
            background: #1e293b;
        }

        .card-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ef4444;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .card-badge.green { background: var(--accent); color: #060913; }
        .card-badge.purple { background: var(--primary); }

        .card-body { padding: 18px; }

        .card-cat {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #818cf8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-cat .stars { color: #fbbf24; }
        .card-title { font-size: 1.02rem; font-weight: 800; margin-bottom: 14px; line-height: 1.5; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .price-box .old { display: block; font-size: 0.75rem; color: var(--text-muted); text-decoration: line-through; }
        .price-box .new { font-size: 1.05rem; font-weight: 900; color: #34d399; }

        .buy-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .buy-btn:hover { background: var(--accent); color: #060913; }

        /* --- ۶. بخش تبلیغاتی ویژه (بنر مستر املاکی) --- */
        .promo-banner-section {
            padding: 35px 0 50px;
        }

        .ad-showcase-card {
            background: linear-gradient(135deg, #131b31 0%, #1e1b4b 55%, #064e3b 100%);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 24px;
            padding: 32px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 32px;
            align-items: center;
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .ad-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .ad-content h3 {
            font-size: 1.55rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .ad-content h3 span {
            color: #34d399;
        }

        .ad-content p {
            color: #cbd5e1;
            font-size: 0.94rem;
            margin-bottom: 22px;
            line-height: 1.8;
        }

        .ad-features {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
            font-size: 0.82rem;
            color: #a5b4fc;
        }

        .ad-features span {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            padding: 5px 12px;
            border-radius: 10px;
        }

        .ad-cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: #060913;
            font-weight: 900;
            font-size: 0.95rem;
            padding: 13px 26px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .ad-cta-btn:hover {
            background: #34d399;
            transform: translateY(-3px);
        }

        /* قاب مرورگر برای نمایش عکس صفحه mramlaki.ir */
        .browser-mockup {
            background: #0b0f1d;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.65);
            transition: transform 0.35s ease;
            display: block;
        }

        .browser-mockup:hover {
            transform: scale(1.03);
            border-color: var(--accent);
        }

        .browser-bar {
            background: #161f36;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            direction: ltr;
        }

        .browser-dots {
            display: flex;
            gap: 6px;
        }

        .browser-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }

        .browser-url {
            background: #0b0f1d;
            color: #34d399;
            font-size: 0.75rem;
            padding: 3px 14px;
            border-radius: 6px;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .browser-screen {
            position: relative;
            height: 230px;
            background: #1e293b;
            overflow: hidden;
        }

        .browser-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 0.6s ease;
        }

        .browser-mockup:hover .browser-screen img {
            transform: scale(1.06);
        }

        .browser-overlay-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(6px);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- ۷. استایل پنجره‌های پاپ‌آپ (Modals) --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.15);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 28px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 18px;
            left: 18px;
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border
