<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نکسرا (Nexra) | مارکت‌پلیس قالب و اسکریپت حرفه‌ای</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- آیکون‌های FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- نوار جشنواره بالا -->
    <div class="top-promo">
        <div class="container promo-flex">
            <div class="promo-right">
                <span class="pulse-dot"></span>
                <span>جشنواره فروش ویژه نکسرا: <strong>۵۰٪ تخفیف</strong> روی تمام قالب‌ها و اسکریپت‌ها!</span>
            </div>
            <div class="promo-timer" id="countdown">
                <div class="time-box"><span id="seconds">۲۹</span><small>ثانیه</small></div>
                <span class="colon">:</span>
                <div class="time-box"><span id="minutes">۳۵</span><small>دقیقه</small></div>
                <span class="colon">:</span>
                <div class="time-box"><span id="hours">۱۳</span><small>ساعت</small></div>
            </div>
        </div>
    </div>

    <!-- هدر اصلی -->
    <header class="navbar">
        <div class="container nav-container">
            <!-- دکمه منوی موبایل -->
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="منو">
                <i class="fas fa-bars"></i>
            </button>

            <!-- لوگو (logo.png) -->
            <a href="#" class="brand-logo">
                <img src="logo.png" alt="Nexra" onerror="this.style.display='none'">
                <span class="brand-text">NEXRA</span>
            </a>

            <!-- لینک‌های منو -->
            <nav class="nav-menu" id="navMenu">
                <div class="mobile-menu-header">
                    <span class="brand-text">NEXRA</span>
                    <button class="close-menu-btn" id="closeMenuBtn"><i class="fas fa-times"></i></button>
                </div>
                <a href="#products" class="nav-item active"><i class="fab fa-wordpress"></i> قالب وردپرس</a>
                <a href="#products" class="nav-item"><i class="fas fa-plug"></i> افزونه وردپرس</a>
                <a href="#products" class="nav-item"><i class="fab fa-html5"></i> قالب HTML</a>
                <a href="#products" class="nav-item"><i class="fas fa-code"></i> اسکریپت آماده</a>
            </nav>

            <!-- اکشن‌های سمت چپ -->
            <div class="nav-actions">
                <button class="cart-btn" id="cartBtn" title="سبد خرید">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-badge" id="cartCount">۰</span>
                </button>
                <a href="#pro" class="btn-vip">
                    <i class="fas fa-bolt"></i>
                    <span>اشتراک پرو</span>
                </a>
                <a href="#login" class="btn-login">
                    <i class="far fa-user"></i>
                    <span>ورود / عضویت</span>
                </a>
            </div>
        </div>
    </header>

    <!-- بخش هیرو (دو ستونه بدون تداخل متن و عکس) -->
    <section class="hero">
        <div class="glow-circle glow-1"></div>
        <div class="glow-circle glow-2"></div>

        <div class="container hero-grid">
            <!-- ستون راست: محتوا و جستجو -->
            <div class="hero-content">
                <div class="hero-badge">
                    <i class="fas fa-sparkles
